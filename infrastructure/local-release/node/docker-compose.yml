version: '3.9'

# Local Release - Node Group with Nginx Reverse Proxy
# Architecture:
#   Nginx (8080)
#   ├── /api/*   → singalong-node:5002
#   └── /admin/* → singalong-node:5002 (serves embedded React UI + API)
#
# Access via: http://localhost:8080/admin

services:
  # Nginx Reverse Proxy - Gateway for the Node group
  nginx:
    image: nginx:1.25-alpine
    container_name: singalong-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - singalong-network
    depends_on:
      - node
    restart: unless-stopped

  # Singalong Node Service (using SQLite, includes embedded React Admin UI)
  node:
    build:
      context: ../../../  # Project root to access both apps
      dockerfile: infrastructure/release/node.dockerfile
    container_name: singalong-node
    environment:
      - ENVIRONMENT=development
      - DEBUG=${DEBUG:-True}
      - DATABASE_URL=sqlite:////data/node/singalong_node.db
      - MASTER_URL=${MASTER_PUBLIC_URL:-https://singalong-master-development.nicenature.space}
      - MASTER_GRAPHQL_URL=${MASTER_PUBLIC_URL:-https://singalong-master-development.nicenature.space}/graphql/
      - NODE_MASTER_API_KEY=${NODE_MASTER_API_KEY:-dev-key-production-secret-1234567890}
      - OPENAI_API_KEY=${OPENAI_KEY}

    # No direct port exposure - accessed through Nginx gateway at /api and /admin
    volumes:
      # Data mounts only (no app code bind mount)
      - ./data/node:/data/node  # Node database and storage (includes videos)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health').read()"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - singalong-network
    restart: unless-stopped

  # Singalong Controller UI - User-facing Karaoke Interface
  # controller:
  #   build:
  #     context: ../../../apps/singalong-controller
  #     dockerfile: ../../../../infrastructure/release/controller.dockerfile
  #   container_name: singalong-controller
  #   environment:
  #     VITE_API_BASE_URL: /api
  #   # No direct port exposure - accessed through Nginx at /controller
  #   depends_on:
  #     - node
  #   networks:
  #     - singalong-network
  #   restart: unless-stopped

volumes: {}

networks:
  singalong-network:
    driver: bridge
