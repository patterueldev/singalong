version: '3.9'

services:
  # PostgreSQL Database for Master
  master-db:
    image: postgres:16-alpine
    container_name: singalong-master-db
    environment:
      POSTGRES_DB: singalong_master
      POSTGRES_USER: master_user
      POSTGRES_PASSWORD: master_password_dev
    ports:
      - "5432:5432"
    volumes:
      - master-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U master_user -d singalong_master"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - singalong-network

  # Singalong Master Service
  master:
    build:
      context: ../../../apps/singalong-master
      dockerfile: ../../../infrastructure/release/master.dockerfile
    container_name: singalong-master
    depends_on:
      master-db:
        condition: service_healthy
    environment:
      # Application Settings
      DEBUG: "False"
      PORT: 5001
      HOST: 0.0.0.0

      # API Key for Node authentication
      # IMPORTANT: Change this in production
      MASTER_API_KEY: dev-key-production-secret-1234567890,dev-key-production-secret-player-1234567890

      # JWT Configuration
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_SECONDS: "3600"
      JWT_REFRESH_TOKEN_EXPIRE_SECONDS: "604800"

      # User JWT Secret
      # IMPORTANT: Change this in production
      USER_JWT_SECRET: dev-user-jwt-secret-change-in-production

      # Database Configuration
      DATABASE_URL: postgresql://master_user:master_password_dev@master-db:5432/singalong_master

    ports:
      - "5001:5001"
    volumes:
      # Video storage
      - master-videos:/app/videos
      # Application logs
      - master-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health').read()"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - singalong-network
    restart: unless-stopped

volumes:
  master-db-data:
    driver: local
  master-videos:
    driver: local
  master-logs:
    driver: local

networks:
  singalong-network:
    driver: bridge
