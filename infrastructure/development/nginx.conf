# Nginx configuration for Singalong Node Group
# Routes:
#   /api/*        → singalong-node (5002)
#   /admin/*      → singalong-admin (3001)
#   /controller/* → singalong-controller (3002)
#   /             → redirect to /admin

upstream singalong_node {
    server singalong-node:5002;
}

upstream singalong_admin {
    server singalong-admin:3001;
}

server {
    listen 8080;
    server_name _;
    
    # Allow larger uploads
    client_max_body_size 100M;
    
    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # API routes → Node backend
    location /api/ {
        proxy_pass http://singalong_node/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    
    # Admin routes → Admin frontend
    location /admin/ {
        proxy_pass http://singalong_admin/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    
    # Root → redirect to admin
    location / {
        return 301 /admin;
    }
}
