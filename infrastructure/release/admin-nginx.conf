# Nginx configuration for Singalong Admin UI (SPA)
# Serves React app from /admin subpath with proper routing

server {
    listen 3001;
    server_name _;

    # Allow larger uploads
    client_max_body_size 100M;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Serve static files from /admin/
    location /admin/ {
        # Try to serve the file, otherwise fall back to index.html for SPA routing
        try_files $uri $uri/ /admin/index.html;
        
        # Cache static assets
        location ~ ^/admin/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Root location redirects to /admin/
    location / {
        return 301 /admin/;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
