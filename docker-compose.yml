version: '3.8'

# Docker Compose configuration for Singalong development environment
# Provides hot-reload development setup for all services
#
# Node Group Architecture (with Nginx reverse proxy):
#   Nginx (port 80)
#   ├── /api/*        → singalong-node:5002
#   ├── /admin/*      → singalong-admin:3001
#   └── /controller/* → singalong-controller:3002
#
# Services communicate internally (Nginx to backends)
# External access is through Nginx on port 80

services:
  # Nginx Reverse Proxy - Gateway for the Node group
  nginx:
    build:
      context: .
      dockerfile: infrastructure/development/nginx.dockerfile
    container_name: singalong-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/development/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - singalong-network
    depends_on:
      - node
      - admin
    restart: unless-stopped

  # Node Service - Local karaoke server (API backend)
  node:
    build:
      context: ./apps/singalong-node
      dockerfile: ../../infrastructure/development/node.dockerfile
    container_name: singalong-node
    # No direct port exposure - accessed through Nginx gateway at /api
    # (mDNS bridge runs natively and checks health via Nginx, then advertises port 80)
    volumes:
      - ./apps/singalong-node:/app
      - ./data/node:/data/node  # Mount node video storage and database
      - ./data/master/videos:/data/master/videos  # Access master videos for streaming (B3 MVP)
      - /app/__pycache__  # Exclude pycache from volume mount
    environment:
      - ENVIRONMENT=development
      - DEBUG=${DEBUG:-True}
      - DATABASE_URL=sqlite:////data/node/singalong_node.db
      - MASTER_URL=${MASTER_PUBLIC_URL:-https://singalong-master-development.nicenature.space}
      - MASTER_GRAPHQL_URL=${MASTER_PUBLIC_URL:-https://singalong-master-development.nicenature.space}/graphql/
      - NODE_MASTER_API_KEY=${NODE_MASTER_API_KEY:-dev-key-production-secret-1234567890}
      - OPENAI_API_KEY=${OPENAI_KEY}
    networks:
      - singalong-network
    restart: unless-stopped

  # Admin Dashboard - React/Vite frontend for administrators
  admin:
    build:
      context: .
      dockerfile: infrastructure/development/admin.dockerfile
    container_name: singalong-admin
    # No direct port exposure - accessed through Nginx at /admin
    volumes:
      - ./apps/singalong-admin:/app
      - /app/node_modules  # Exclude node_modules from volume mount
    environment:
      # Admin accesses Node API through Nginx gateway (relative path)
      - VITE_API_BASE_URL=/api
      - ENVIRONMENT=development
      - WATCHPACK_POLLING=true  # Enable polling for file changes
    networks:
      - singalong-network
    depends_on:
      - node
    restart: unless-stopped

  # Controller - React/Vite frontend for karaoke control
  controller:
    build:
      context: .
      dockerfile: infrastructure/development/controller.dockerfile
    container_name: singalong-controller
    # No direct port exposure - accessed through Nginx at /controller
    volumes:
      - ./apps/singalong-controller:/app
      - /app/node_modules  # Exclude node_modules from volume mount
    environment:
      # Controller accesses Node API through Nginx gateway (relative path)
      - VITE_API_BASE_URL=/api
      - ENVIRONMENT=development
      - WATCHPACK_POLLING=true  # Enable polling for file changes
    networks:
      - singalong-network
    depends_on:
      - node
    restart: unless-stopped

  # mDNS Bridge - DISABLED on macOS (Docker + Lima = isolated network)
  # To start bridge on macOS, run: cd apps/singalong-mdns-bridge && bash run.sh
  # For Linux deployment: Uncomment below and it will use network_mode: host correctly
  # See: MDNS_CONSTRAINT_DOCUMENTATION.md for full explanation
  # 
  # mdns-bridge:
  #   build:
  #     context: ./apps/singalong-mdns-bridge
  #     dockerfile: ../../infrastructure/development/mdns-bridge.dockerfile
  #   container_name: singalong-mdns-bridge
  #   network_mode: host  # Required for mDNS multicast to reach the host (Linux only)
  #   environment:
  #     - NODE_HOST=localhost  # Host localhost (when Node is on bridge network)
  #     - NODE_PORT=5002
  #     - ENVIRONMENT=development
  #     - DEBUG=${DEBUG:-True}
  #   restart: unless-stopped
  #   depends_on:
  #     - node

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: singalong-cloudflared
    command: 
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARED_TOKEN}
    restart: unless-stopped
    networks:
      - singalong-network

networks:
  singalong-network:
    driver: bridge
