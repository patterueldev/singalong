name: PR / Node Backend Checks

on:
  workflow_call:

jobs:
  node-backend-checks:
    name: Node backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/singalong-node
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run lint with Black
        run: poetry run black --check . || true

      - name: Run lint with Ruff
        run: poetry run ruff check . || true

      - name: Run type checks
        run: poetry run pyright . || true

      - name: Run unit tests
        run: poetry run pytest --cov=app || true

      - name: Verify package integrity
        run: |
          poetry check
          echo "✅ Node backend checks passed"
