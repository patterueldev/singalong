#
# Development Build & Push
#
# Purpose:
#   Automated build and push to GHCR when code is merged to develop branch.
#   Detects what changed and delegates to build orchestrator.
#
# Trigger:
#   - Push to develop branch (PR merge)
#
# What it does:
#   1. Detects changes in master and node services
#   2. Calls build-orchestrator.yml with detected changes
#   3. Orchestrator builds and pushes images for changed services
#   4. Images tagged as ghcr.io/org/repo/service:dev
#
# Related Workflows:
#   • .github/workflows/build-orchestrator.yml (core build orchestration)
#   • .github/workflows/build-master.yml (master service build)
#   • .github/workflows/build-node.yml (node service build)
#
# Notes:
#   - Runs on every push to develop
#   - Only builds services with detected changes
#   - Images tagged with :dev
#   - Requires GITHUB_TOKEN for GHCR push
#

name: Development Build & Push

# TODO: Temporarily trigger on pull_request to test detection logic, switch to push after validation
on:
  pull_request:
    branches:
      - develop

# on:
#   push:
#     branches:
#       - develop

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      master: ${{ steps.changes.outputs.master }}
      node: ${{ steps.changes.outputs.node }}
      admin: ${{ steps.changes.outputs.admin }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch (for PRs)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}

      - name: Detect changed files
        id: changes
        run: |
          # Determine the comparison base
          # For pull_request events, compare against base branch
          # For push events, compare against previous commit
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Pull request: compare against base branch
            PREVIOUS_COMMIT="origin/${{ github.base_ref }}"
            CURRENT_COMMIT="HEAD"
          else
            # Push event: compare against previous commit
            if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              PREVIOUS_COMMIT="${{ github.event.before }}"
            else
              PREVIOUS_COMMIT="HEAD~1"
            fi
            CURRENT_COMMIT="HEAD"
          fi

          echo "Comparing changes between $PREVIOUS_COMMIT and $CURRENT_COMMIT"
          echo ""

          # Check if master files changed
          if git diff --name-only $PREVIOUS_COMMIT $CURRENT_COMMIT | grep -q "^apps/singalong-master/" || git diff --name-only $PREVIOUS_COMMIT $CURRENT_COMMIT | grep -q "^infrastructure.*master"; then
            echo "master=true" >> $GITHUB_OUTPUT
            echo "✓ Changes detected in master service"
          else
            echo "master=false" >> $GITHUB_OUTPUT
            echo "✗ No changes in master service"
          fi

          # Check if node files changed
          if git diff --name-only $PREVIOUS_COMMIT $CURRENT_COMMIT | grep -q "^apps/singalong-node/" || git diff --name-only $PREVIOUS_COMMIT $CURRENT_COMMIT | grep -q "^infrastructure.*node"; then
            echo "node=true" >> $GITHUB_OUTPUT
            echo "✓ Changes detected in node service"
          else
            echo "node=false" >> $GITHUB_OUTPUT
            echo "✗ No changes in node service"
          fi

          # Check if admin files changed
          if git diff --name-only $PREVIOUS_COMMIT $CURRENT_COMMIT | grep -q "^apps/singalong-admin/" || git diff --name-only $PREVIOUS_COMMIT $CURRENT_COMMIT | grep -q "^infrastructure.*admin"; then
            echo "admin=true" >> $GITHUB_OUTPUT
            echo "✓ Changes detected in admin service"
          else
            echo "admin=false" >> $GITHUB_OUTPUT
            echo "✗ No changes in admin service"
          fi

          echo ""
          echo "Changed files:"
          git diff --name-only $PREVIOUS_COMMIT HEAD

          # TODO: Temporarily set all to true for testing, remove after validation
          echo "master=true" >> $GITHUB_OUTPUT
          echo "node=true" >> $GITHUB_OUTPUT
          echo "admin=true" >> $GITHUB_OUTPUT

      - name: Output detection results
        run: |
          echo "Detection complete:"
          echo "- Master changed: ${{ steps.changes.outputs.master }}"
          echo "- Node changed: ${{ steps.changes.outputs.node }}"
          echo "- Admin changed: ${{ steps.changes.outputs.admin }}"

  build:
    name: Orchestrate Development Build
    needs: detect-changes
    uses: ./.github/workflows/build-orchestrator.yml
    with:
      env: dev
      master: ${{ needs.detect-changes.outputs.master }}
      node: ${{ needs.detect-changes.outputs.node }}
      admin: ${{ needs.detect-changes.outputs.admin }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
