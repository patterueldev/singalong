name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - develop
      - main

jobs:
  # Detect changed files for conditional jobs
  detect-changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      master: ${{ steps.changes.outputs.master }}
      node: ${{ steps.changes.outputs.node }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        run: |
          # Get the merge base for comparing branches
          MERGE_BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          
          # Check if Master files changed
          if git diff --name-only $MERGE_BASE HEAD | grep -q "^apps/singalong-master/"; then
            echo "master=true" >> $GITHUB_OUTPUT
          else
            echo "master=false" >> $GITHUB_OUTPUT
          fi
          
          # Check if Node files changed
          if git diff --name-only $MERGE_BASE HEAD | grep -q "^apps/singalong-node/"; then
            echo "node=true" >> $GITHUB_OUTPUT
          else
            echo "node=false" >> $GITHUB_OUTPUT
          fi

  # Base checks: enforce RC branch rules
  base-checks:
    name: Base checks (RC branch rules)
    uses: ./.github/workflows/scripts/pr-base-checks.yml

  # Conventional commits: validate PR title and body
  conventional-commits:
    name: Conventional commits and PR body
    uses: ./.github/workflows/scripts/pr-conventional-commits.yml

  # Master backend build: only run if master files changed
  master-backend-checks:
    name: Master backend checks
    needs: detect-changes
    uses: ./.github/workflows/scripts/pr-master-checks.yml
    if: needs.detect-changes.outputs.master == 'true'

  # Node backend build: only run if node files changed
  node-backend-checks:
    name: Node backend checks
    needs: detect-changes
    uses: ./.github/workflows/scripts/pr-node-checks.yml
    if: needs.detect-changes.outputs.node == 'true'

  # Summary: display overall check results
  summary:
    name: PR Checks Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, base-checks, conventional-commits, master-backend-checks, node-backend-checks]
    if: always()
    steps:
      - name: Check for failures
        run: |
          # Fail summary if any required check failed
          FAILED=false
          
          # base-checks and conventional-commits always run
          if [ "${{ needs.base-checks.result }}" = "failure" ]; then
            echo "❌ Base checks failed"
            FAILED=true
          fi
          
          if [ "${{ needs.conventional-commits.result }}" = "failure" ]; then
            echo "❌ Conventional commits validation failed"
            FAILED=true
          fi
          
          # master-backend-checks: only fails if it ran and failed (not if skipped)
          if [ "${{ needs.master-backend-checks.result }}" = "failure" ]; then
            echo "❌ Master backend checks failed"
            FAILED=true
          fi
          
          # node-backend-checks: only fails if it ran and failed (not if skipped)
          if [ "${{ needs.node-backend-checks.result }}" = "failure" ]; then
            echo "❌ Node backend checks failed"
            FAILED=true
          fi
          
          if [ "$FAILED" = "true" ]; then
            exit 1
          fi

      - name: Generate Summary
        run: |
          echo "## ✅ PR Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Changed" >> $GITHUB_STEP_SUMMARY
          echo "- Master: ${{ needs.detect-changes.outputs.master }}" >> $GITHUB_STEP_SUMMARY
          echo "- Node: ${{ needs.detect-changes.outputs.node }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks Executed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Base Checks (RC branch rules)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Conventional Commits (PR format)" >> $GITHUB_STEP_SUMMARY
          
          # Conditionally show master checks
          if [ "${{ needs.detect-changes.outputs.master }}" = "true" ]; then
            MASTER_STATUS="${{ needs.master-backend-checks.result }}"
            MASTER_ICON=$([ "$MASTER_STATUS" = "success" ] && echo "✅" || echo "❌")
            echo "- $MASTER_ICON Master Backend Checks ($MASTER_STATUS)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⊘ Master Backend Checks (skipped - no changes)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Conditionally show node checks
          if [ "${{ needs.detect-changes.outputs.node }}" = "true" ]; then
            NODE_STATUS="${{ needs.node-backend-checks.result }}"
            NODE_ICON=$([ "$NODE_STATUS" = "success" ] && echo "✅" || echo "❌")
            echo "- $NODE_ICON Node Backend Checks ($NODE_STATUS)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⊘ Node Backend Checks (skipped - no changes)" >> $GITHUB_STEP_SUMMARY
          fi