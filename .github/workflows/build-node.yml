#
# Build Node Service (Reusable Workflow)
#
# Purpose:
#   Builds and pushes the Node service Docker image to GHCR.
#   Called by build-orchestrator.yml with environment parameter.
#
# Trigger:
#   - Called via workflow_call from build-orchestrator.yml
#
# What it does:
#   1. Checks out code
#   2. Sets up Docker Buildx
#   3. Authenticates to GHCR
#   4. Builds Docker image
#   5. Pushes to GHCR with environment tag (dev|qa|prod)
#
# Related Workflows:
#   • .github/workflows/build-orchestrator.yml (main orchestrator)
#   • .github/workflows/dev-build.yml (develop entry point)
#

name: Build Node Service

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
        description: 'Build environment: dev, qa, or prod'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push Node Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/node
          tags: |
            type=raw,value=${{ inputs.env }}
            type=sha,prefix=${{ inputs.env }}-

      - name: Build and push Node image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/singalong-node
          file: ./infrastructure/release/node.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/node:${{ inputs.env }}
          cache-to: type=inline

      - name: Image pushed
        run: |
          echo "✓ Node image built and pushed to GHCR"
          echo "Image: ghcr.io/${{ github.repository }}/node:${{ inputs.env }}"
