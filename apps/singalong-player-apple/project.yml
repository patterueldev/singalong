name: SingalongPlayer
organizationName: Nicenature
bundleIdPrefix: com.nicenature

settings:
  SWIFT_VERSION: 5.9

targets:
  SingalongPlayer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SingalongPlayer
        includes:
          - "**/*.swift"
    resources:
      - path: SingalongPlayer/Assets.xcassets
      - path: SingalongPlayer/Preview\ Assets.xcassets
      - path: SingalongPlayer/Info.plist
    info:
      path: SingalongPlayer/Info.plist
      useBaseLocalizationAsUnderscore: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nicenature.singalong-player
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      INFOPLIST_FILE: SingalongPlayer/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
