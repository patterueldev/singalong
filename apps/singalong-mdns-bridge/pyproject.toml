[tool.poetry]
name = "singalong-mdns-bridge"
version = "0.1.0"
description = "mDNS bridge for advertising Singalong Node service on host network"
authors = ["Singalong Team <team@singalong.dev>"]
readme = "README.md"
packages = [{include = "app"}]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "^1.0.0"
zeroconf = "^0.148.0"

[tool.poetry.group.dev.dependencies]
black = "^23.12.0"
ruff = "^0.1.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I001"]
