[tool.poetry]
name = "singalong-master"
version = "0.1.0"
description = "Singalong Master Service - Central server for video storage and data management"
authors = ["Singalong Team <team@singalong.dev>"]
readme = "README.md"
packages = [{include = "app"}]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
PyJWT = "^2.8.1"
python-multipart = "^0.0.7"
sqlalchemy = "^2.0.0"
psycopg = {extras = ["binary"], version = "^3.0.0"}
ariadne = "^0.21.0"
bcrypt = "^4.1.0"
passlib = "^1.7.4"
yt-dlp = ">=2026.04.01"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.2"
black = "^23.12.0"
ruff = "^0.1.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I001"]
