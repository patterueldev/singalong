[tool.poetry]
name = "singalong-node"
version = "0.1.0"
description = "Local karaoke server for singalong system"
authors = ["Singalong Team <team@singalong.dev>"]
packages = [{include = "app"}]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.136.0,<0.137.0"
uvicorn = {extras = ["standard"], version = ">=0.45.0,<0.46.0"}
python-dotenv = ">=1.2.2,<2.0.0"
httpx = ">=0.28.1,<0.29.0"
pydantic = ">=2.13.3,<3.0.0"
pydantic-settings = ">=2.14.0,<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
