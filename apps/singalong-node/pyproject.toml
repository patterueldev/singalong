[tool.poetry]
name = "singalong-node"
version = "0.1.0"
description = "Local karaoke server for singalong system"
authors = ["Singalong Team <team@singalong.dev>"]
packages = [{include = "app"}]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.136.0,<0.137.0"
uvicorn = {extras = ["standard"], version = ">=0.45.0,<0.46.0"}
python-dotenv = ">=1.2.2,<2.0.0"
httpx = "^0.28.1"
pydantic = ">=2.13.3,<3.0.0"
pydantic-settings = ">=2.14.0,<3.0.0"
PyJWT = "^2.8.1"
bcrypt = "^4.1.0"
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
yt-dlp = ">=2024.1.1"
openai = "^1.59.0"
musicbrainzngs = "^0.7.1"
aiohttp = "^3.9.1"
langdetect = "^1.0.9"
websockets = "^12.0"
zeroconf = "^0.131.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.12.0"
ruff = "^0.1.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I001"]
